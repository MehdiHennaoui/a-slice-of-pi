name: Setup
description: Install pnpm, Node, and project dependencies

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
      with:
        version: 9
    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: pnpm
    - run: pnpm install
      shell: bash
